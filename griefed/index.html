<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Griefed — numerius.xyz</title>
  <meta name="description" content="Griefed notice" />
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    html,body { height:100%; margin:0 }
    /* Black background, white text */
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height:1.6; color:#fff; background:#000 }
    main { min-height:100%; display:flex; align-items:center; justify-content:center; padding:48px }
    .box { max-width:900px; text-align:center; position:relative }
    .content { position:relative; z-index:1 }
    h1 { font-size:2rem; margin:0 0 8px }
    p.lead { color:#fff; font-size:1.25rem; margin:0 }
    a.discord { color:#58a6ff; text-decoration:underline }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <div class="content">
        <h1>Uh Oh, you got griefed</h1>
        <p class="lead">Contact at <a class="discord" href="https://discord.gg/FdtjtWjrvu" target="_blank" rel="noopener noreferrer">https://discord.gg/FdtjtWjrvu</a></p>
      </div>

      <!-- Audio: chooses eek.mp3 if present at /griefed, falls back to ambient.mp3. Autoplay attempts to play with sound by default. -->
      <audio id="bg-audio" loop autoplay></audio>

    </div>

    <script>
      (function(){
        const a = document.getElementById('bg-audio');
        const audioCandidates = ['/griefed/eek.mp3', '/griefed/ambient.mp3'];

        function checkAudio(index){
          if(index >= audioCandidates.length){
            if(a) a.remove();
            return;
          }
          const url = audioCandidates[index];
          fetch(url, { method: 'HEAD' }).then(resp => {
            if(resp.ok){
              a.src = url;
              a.muted = false;
              a.play().catch(() => {
                a.muted = true;
                a.play().catch(()=>{});
              });
            } else {
              checkAudio(index + 1);
            }
          }).catch(() => {
            fetch(url, { method: 'GET', headers: { Range: 'bytes=0-1' } }).then(r => {
              if(r.ok) {
                a.src = url;
                a.muted = false;
                a.play().catch(() => {
                  a.muted = true;
                  a.play().catch(()=>{});
                });
              } else {
                checkAudio(index + 1);
              }
            }).catch(() => checkAudio(index + 1));
          });
        }

        checkAudio(0);

        // Start playback on the first cursor/pointer movement only. Subsequent movements are ignored.
        function handleFirstPointerMove(){
          if(a){
            a.muted = false;
            a.play().catch(()=>{});
          }
          // listener is registered with { once: true } so it will be removed automatically
        }

        // Use pointermove to cover mouse, pen, and touch pointers. Use once:true so it only fires once.
        document.addEventListener('pointermove', handleFirstPointerMove, { once: true });

        // Keep click fallback for older browsers or gestures
        document.addEventListener('click', function onFirst(){
          if(a && a.src){
            a.muted = false;
            a.play().catch(()=>{});
          }
          document.removeEventListener('click', onFirst);
        });
      })();
    </script>
  </main>
</body>
</html>

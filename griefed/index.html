<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Griefed — numerius.xyz</title>
  <meta name="description" content="Griefed notice" />
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    html,body { height:100%; margin:0 }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height:1.6; color:#111; background:#fff }
    main { min-height:100%; display:flex; align-items:center; justify-content:center; padding:48px }
    .box { max-width:900px; text-align:center }
    h1 { font-size:2rem; margin:0 0 8px }
    p.lead { color:#000; font-size:1.25rem; margin:0 }
    a.discord { color:#0366d6; text-decoration:underline }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <h1>Uh Oh, you got griefed</h1>
      <p class="lead">Contact at <a class="discord" href="https://discord.gg/FdtjtWjrvu" target="_blank" rel="noopener noreferrer">https://discord.gg/FdtjtWjrvu</a></p>

      <!-- Audio: chooses eek.mp3 if present at /griefed, falls back to ambient.mp3. Autoplay attempts to play with sound by default. -->
      <audio id="bg-audio" loop autoplay></audio>

    </div>

    <script>
      (function(){
        const a = document.getElementById('bg-audio');
        // Public-facing paths under /griefed
        const candidates = ['/griefed/eek.mp3', '/griefed/ambient.mp3'];

        function checkAndSet(index){
          if(index >= candidates.length){
            if(a) a.remove();
            return;
          }
          const url = candidates[index];
          fetch(url, { method: 'HEAD' }).then(resp => {
            if(resp.ok){
              a.src = url;
              // Try to play with sound by default
              a.muted = false;
              a.play().catch(() => {
                // If the browser blocks unmuted autoplay, fallback to muted autoplay so audio starts silently
                a.muted = true;
                a.play().catch(()=>{});
              });
            } else {
              checkAndSet(index + 1);
            }
          }).catch(() => {
            // fallback to a small GET if HEAD isn't allowed
            fetch(url, { method: 'GET', headers: { Range: 'bytes=0-1' } }).then(r => {
              if(r.ok) {
                a.src = url;
                a.muted = false;
                a.play().catch(() => {
                  a.muted = true;
                  a.play().catch(()=>{});
                });
              } else {
                checkAndSet(index + 1);
              }
            }).catch(() => checkAndSet(index + 1));
          });
        }

        checkAndSet(0);

        // If the user interacts later, try to unmute and play (no visible control provided per request)
        document.addEventListener('click', function onFirst(){
          if(a && a.src){
            a.muted = false;
            a.play().catch(()=>{});
          }
          document.removeEventListener('click', onFirst);
        });
      })();
    </script>
  </main>
</body>
</html>
